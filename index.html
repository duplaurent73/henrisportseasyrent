<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyRent Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
    --bg:#f2f2f7; --panel:#ffffff; --text:#000000; --muted:#8e8e93;
    --blue:#007aff; --green:#34c759; --orange:#ff9500; --purple:#af52de;
    --radius:20px;
    --shadow:0 2px 12px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.06);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    min-height:100vh;
}
.sticky-header{
    position:sticky; top:calc(-1px + var(--safe-top)); z-index:100;
    background:rgba(242,242,247,0.8);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    margin:-16px -16px 16px; padding:calc(12px + var(--safe-top)) 16px 12px;
    border-bottom:0.5px solid rgba(0,0,0,0.1);
}
h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;}
.subtitle{color:var(--muted);font-size:13px;font-weight:500;}
.segmented-control{
    display:flex; background:rgba(118,118,128,0.12); border-radius:12px;
    padding:2px; margin:12px 0; gap:2px;
}
.segmented-control button{
    flex:1; border:none; background:transparent; padding:8px 4px;
    font-size:13px; font-weight:500; color:var(--text); border-radius:10px;
    cursor:pointer; transition:all 0.2s cubic-bezier(0.4,0,0.2,1); white-space:nowrap;
}
.segmented-control button.active{
    background:#ffffff; box-shadow:0 1px 4px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.08);
    font-weight:600;
}
.select-wrapper{position:relative;margin-bottom:12px;}
.select-wrapper::after{
    content:'▼'; position:absolute; right:16px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:12px; pointer-events:none;
}
#branchFilter{
    width:100%; appearance:none; -webkit-appearance:none;
    padding:12px 40px 12px 16px; font-size:15px; font-weight:500;
    border:none; border-radius:12px; background:#ffffff; cursor:pointer;
    box-shadow:var(--shadow);
}
.branch-kpis{margin-bottom:20px;}
.branch-kpi-block{
    background:var(--panel); border-radius:var(--radius); padding:16px;
    margin-bottom:12px; box-shadow:var(--shadow);
}
.branch-kpi-block h3{margin-bottom:12px;font-size:15px;color:var(--blue);font-weight:600;}
.branch-kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:1200px){.branch-kpi-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.branch-kpi-row{grid-template-columns:repeat(2,1fr);}}
.dashboard{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
.kpi{
    background:white; border-radius:var(--radius); padding:16px;
    display:flex; gap:12px; align-items:center; box-shadow:var(--shadow);
}
.kpi-icon{
    width:48px;height:48px;border-radius:12px;display:flex;justify-content:center;
    align-items:center;font-size:22px;flex-shrink:0;
}
.kpi-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.kpi-value{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-0.5px;}
.panel{
    background:white;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.panel h2{font-size:15px;margin-bottom:12px;font-weight:600;letter-spacing:-0.3px;}
.panel-full{grid-column:span 12;}
.panel-half{grid-column:span 6;}
.panel-third{grid-column:span 4;}
@media(max-width:1000px){.panel-half,.panel-third{grid-column:span 12;}}
@media(max-width:768px){
    .kpi{grid-column:span 6 !important;}
    .dashboard{gap:12px;}
}
@media(max-width:480px){
    .kpi{grid-column:span 12 !important;}
}
canvas{max-height:280px;}
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:400px;}
th{
    text-align:left;padding:8px;color:var(--muted);font-size:11px;
    text-transform:uppercase;font-weight:600;border-bottom:1px solid #e5e5ea;
}
td{padding:10px 8px;border-bottom:1px solid #f2f2f7;}
tr:last-child td{border-bottom:none;}
.badge{
    display:inline-block;padding:4px 10px;border-radius:8px;
    font-size:11px;font-weight:600;margin-right:8px;
}
.badge.location{background:rgba(0,122,255,0.1);color:var(--blue);}
.kpi-mini{background:#f2f2f7;border-radius:12px;padding:10px;}
.kpi-mini .kpi-title{font-size:10px;}
.kpi-mini .kpi-value{font-size:16px;}
.error-msg{
    background:#ffebee;color:#c62828;padding:16px;border-radius:12px;
    margin:16px 0;font-size:14px;text-align:center;grid-column:span 12;
}
.loading{text-align:center;padding:40px;color:var(--muted);grid-column:span 12;}
</style>
</head>
<body>

<div class="sticky-header">
    <h1>🏔️ EasyRent</h1>
    <div class="subtitle" id="periodLabel">Chargement...</div>

    <div class="segmented-control" id="dateBar">
        <button class="active" data-range="today">Aujourd'hui</button>
        <button data-range="yesterday">Hier</button>
        <button data-range="week">Semaine</button>
        <button data-range="month">Mois</button>
    </div>

    <div class="select-wrapper">
        <select id="branchFilter">
            <option value="">🏪 Tous les magasins</option>
        </select>
    </div>
</div>

<div class="branch-kpis" id="branchKpis"></div>

<div class="dashboard" id="dashboard">
    <div class="loading" id="loadingMsg">⏳ Chargement des données...</div>

    <div class="kpi" style="grid-column:span 3;display:none;">
        <div class="kpi-icon" style="background:rgba(0,122,255,0.1);">💰</div>
        <div>
            <div class="kpi-title">CA Total</div>
            <div class="kpi-value" id="caTotal">-</div>
        </div>
    </div>
    <div class="kpi" style="grid-column:span 3;display:none;">
        <div class="kpi-icon" style="background:rgba(255,45,85,0.1);">🧾</div>
        <div>
            <div class="kpi-title">Factures</div>
            <div class="kpi-value" id="nbFactures">-</div>
        </div>
    </div>
    <div class="kpi" style="grid-column:span 3;display:none;">
        <div class="kpi-icon" style="background:rgba(255,149,0,0.1);">👥</div>
        <div>
            <div class="kpi-title">Clients</div>
            <div class="kpi-value" id="nbClients">-</div>
        </div>
    </div>
    <div class="kpi" style="grid-column:span 3;display:none;">
        <div class="kpi-icon" style="background:rgba(52,199,89,0.1);">🛒</div>
        <div>
            <div class="kpi-title">Panier Moyen</div>
            <div class="kpi-value" id="panierMoyen">-</div>
        </div>
    </div>

    <div class="panel panel-full" style="display:none;">
        <h2>📈 CA horaire</h2>
        <canvas id="hourlyChart"></canvas>
    </div>

    <div class="panel panel-half" style="display:none;">
        <h2>💳 Paiements</h2>
        <canvas id="paymentChart"></canvas>
    </div>

    <div class="panel panel-half" style="display:none;">
        <h2>🏷️ Activités</h2>
        <canvas id="syscodeChart"></canvas>
    </div>

    <div class="panel panel-full" style="display:none;">
        <h2>🎿 Groupes de location</h2>
        <canvas id="rentalGroupChart"></canvas>
    </div>

    <div class="panel panel-third" style="display:none;">
        <h2><span class="badge location">LOCATION</span>Top Locations</h2>
        <div class="table-wrapper">
        <table id="locationTable">
            <thead><tr><th>Article</th><th>Contrats</th><th>Jours</th><th>CA</th></tr></thead>
            <tbody></tbody>
        </table>
        </div>
    </div>

    <div class="panel panel-third" style="display:none;">
        <h2><span class="badge" style="background:rgba(52,199,89,0.1);color:var(--green);">VENTE</span>Top Ventes</h2>
        <div class="table-wrapper">
        <table id="salesTable">
            <thead><tr><th>Article</th><th>Qté</th><th>CA</th></tr></thead>
            <tbody></tbody>
        </table>
        </div>
    </div>

    <div class="panel panel-third" style="display:none;">
        <h2><span class="badge" style="background:rgba(255,149,0,0.1);color:var(--orange);">SERVICE</span>Top Services</h2>
        <div class="table-wrapper">
        <table id="serviceTable">
            <thead><tr><th>Service</th><th>Nb</th><th>CA</th></tr></thead>
            <tbody></tbody>
        </table>
        </div>
    </div>
</div>

<script>
// ============================================
// ⚙️ CONFIGURATION
// ============================================
const SYSCODES = {
    L: { label: 'Location', color: '#007aff', icon: '🎿' },
    M: { label: 'Vente',    color: '#34c759', icon: '🛒' },
    S: { label: 'Service',  color: '#ff9500', icon: '🔧' }
};

// URL de base de l'API interne
const API_BASE = 'https://80.13.18.153:11133/easyrest/rest/easyrest/invoices?accessId=bweb123!&top=500';

// ============================================
// 🔧 PROXIES CORS - Teste plusieurs automatiquement
// Si aucun ne marche (certificat SSL auto-signé), crée un Cloudflare Worker gratuit:
// https://dash.cloudflare.com -> Workers -> Create -> colle ce code:
// ---
// export default {
//   async fetch(request) {
//     const url = new URL(request.url).searchParams.get('url');
//     const response = await fetch(url);
//     const newResponse = new Response(response.body, response);
//     newResponse.headers.set('Access-Control-Allow-Origin', '*');
//     return newResponse;
//   }
// }
// Puis remplace CORS_PROXIES par: ['https://ton-worker.workers.dev/?url=']
// ============================================
const CORS_PROXIES = [
    { url: 'https://api.allorigins.win/get?url=', parse: 'json_contents' }, // retourne {contents: "..."}
    { url: 'https://api.codetabs.com/v1/proxy?quest=', parse: 'raw' },
    { url: 'https://corsproxy.org/?', parse: 'raw' },
    { url: 'https://api.cors.lol/?url=', parse: 'raw' },
    { url: 'https://cors.eu.org/', parse: 'raw' }
];

let allInvoices = [];
let currentRange = 'today';
let charts = {};

function getDateBounds(range) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let start, end, label;

    switch(range) {
        case 'today':
            start = today;
            end = new Date(today); end.setDate(end.getDate() + 1);
            label = "Aujourd'hui (" + today.toLocaleDateString('fr-FR') + ")";
            break;
        case 'yesterday':
            start = new Date(today); start.setDate(start.getDate() - 1);
            end = today;
            label = "Hier (" + start.toLocaleDateString('fr-FR') + ")";
            break;
        case 'week':
            start = new Date(today);
            const day = start.getDay() || 7;
            start.setDate(start.getDate() - day + 1);
            end = new Date(today); end.setDate(end.getDate() + 1);
            label = "Semaine du " + start.toLocaleDateString('fr-FR');
            break;
        case 'month':
            start = new Date(now.getFullYear(), now.getMonth(), 1);
            end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            label = now.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            break;
    }
    return { start, end, label };
}

function filterByDate(invoices, range) {
    const { start, end } = getDateBounds(range);
    return invoices.filter(inv => {
        const d = new Date(inv.createdAt);
        return d >= start && d < end;
    });
}

async function fetchWithProxy(apiUrl) {
    let lastError = null;

    for (const proxy of CORS_PROXIES) {
        try {
            console.log('Tentative avec proxy:', proxy.url);
            const fullUrl = proxy.url + encodeURIComponent(apiUrl);

            const response = await fetch(fullUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) throw new Error('HTTP ' + response.status);

            const text = await response.text();
            let data;

            if (proxy.parse === 'json_contents') {
                // allorigins /get retourne {contents: "json string"}
                const wrapper = JSON.parse(text);
                data = JSON.parse(wrapper.contents);
            } else {
                data = JSON.parse(text);
            }

            console.log('Succès avec proxy:', proxy.url);
            return data;

        } catch (e) {
            console.warn('Proxy échoué:', proxy.url, e.message);
            lastError = e;
        }
    }

    throw new Error('Tous les proxies ont échoué. Dernière erreur: ' + (lastError?.message || 'inconnue') +
        '. Solution: crée un Cloudflare Worker gratuit (voir commentaires dans le code).');
}

async function loadInvoices(createdAfter) {
    let invoices = [];
    let skip = 0;

    while(true) {
        const apiUrl = API_BASE + '&createdAfter=' + createdAfter + '&skip=' + skip;
        const batch = await fetchWithProxy(apiUrl);

        if (!Array.isArray(batch)) {
            console.error('Réponse non valide:', batch);
            break;
        }

        invoices.push(...batch);
        if(batch.length < 500) break;
        skip += 500;
    }
    return invoices;
}

function euro(val) {
    return Number(val || 0).toLocaleString('fr-FR', { style:'currency', currency:'EUR' });
}

function chartOptions() {
    return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                position: 'bottom',
                labels: { usePointStyle: true, padding: 15, font: { size: 12 } }
            }
        }
    };
}

function destroyCharts() {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
}

function fillTable(selector, data, mapper) {
    const tbody = document.querySelector(selector);
    if (!tbody) return;
    tbody.innerHTML = '';
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px;">Aucune donnée</td></tr>';
        return;
    }
    data.forEach(row => { tbody.innerHTML += mapper(row); });
}

function showContent() {
    document.getElementById('loadingMsg')?.remove();
    document.querySelectorAll('.dashboard > *:not(.error-msg)').forEach(el => {
        if (el.id !== 'loadingMsg') el.style.display = '';
    });
}

function renderBranchKpis(invoices) {
    const container = document.getElementById('branchKpis');
    if (!container) return;

    const branches = {};
    invoices.forEach(inv => {
        const b = inv.branchCode || 'Inconnu';
        if(!branches[b]) branches[b] = { ca:0, count:0, clients:new Set() };
        branches[b].ca += inv.totalInclTax || 0;
        branches[b].count++;
        if (inv.customerData?.customerId) branches[b].clients.add(inv.customerData.customerId);
    });

    container.innerHTML = '';
    const totalCA = invoices.reduce((s,i)=>s+(i.totalInclTax||0),0);

    Object.entries(branches).sort((a,b) => b[1].ca - a[1].ca).forEach(([name, data]) => {
        const div = document.createElement('div');
        div.className = 'branch-kpi-block';
        div.innerHTML = `
            <h3>🏪 ${name}</h3>
            <div class="branch-kpi-row">
                <div class="kpi-mini"><div class="kpi-title">CA</div><div class="kpi-value">${euro(data.ca)}</div></div>
                <div class="kpi-mini"><div class="kpi-title">Factures</div><div class="kpi-value">${data.count}</div></div>
                <div class="kpi-mini"><div class="kpi-title">Clients</div><div class="kpi-value">${data.clients.size}</div></div>
                <div class="kpi-mini"><div class="kpi-title">Panier moy.</div><div class="kpi-value">${data.count ? euro(data.ca/data.count) : '0 €'}</div></div>
                <div class="kpi-mini"><div class="kpi-title">Part CA</div><div class="kpi-value">${totalCA ? ((data.ca/totalCA)*100).toFixed(1) : '0'}%</div></div>
            </div>
        `;
        container.appendChild(div);
    });
}

function render(invoices, label) {
    destroyCharts();
    showContent();

    let totalCA = 0;
    const customers = new Set();
    const payments = {};
    const groups = {};
    const hourly = {};
    const syscodes = {};
    Object.keys(SYSCODES).forEach(c => syscodes[c] = 0);
    const locations = {}, ventes = {}, services = {};

    invoices.forEach(invoice => {
        totalCA += invoice.totalInclTax || 0;
        if (invoice.customerData?.customerId) customers.add(invoice.customerData.customerId);

        const hour = new Date(invoice.createdAt).getHours();
        hourly[hour] = (hourly[hour] || 0) + (invoice.totalInclTax || 0);

        (invoice.payments || []).forEach(p => {
            payments[p.paymentTypeName] = (payments[p.paymentTypeName] || 0) + (p.amount || 0);
        });

        (invoice.items || []).forEach(item => {
            const code = item.baseSyscode || item.syscode;

            if(syscodes[code] !== undefined) {
                syscodes[code] += item.totalPrice || 0;
            }

            if(code === 'L') {
                if(!locations[item.articleName]) locations[item.articleName] = { contrats:0, jours:0, ca:0 };
                locations[item.articleName].contrats++;
                locations[item.articleName].jours += item.quantity || 0;
                locations[item.articleName].ca += item.totalPrice || 0;
                if(item.rentalData?.rentalGroupName) {
                    const g = item.rentalData.rentalGroupName;
                    groups[g] = (groups[g] || 0) + (item.totalPrice || 0);
                }
            }
            if(code === 'M') {
                if(!ventes[item.articleName]) ventes[item.articleName] = { qty:0, ca:0 };
                ventes[item.articleName].qty += item.quantity || 0;
                ventes[item.articleName].ca += item.totalPrice || 0;
            }
            if(code === 'S') {
                if(!services[item.articleName]) services[item.articleName] = { nb:0, ca:0 };
                services[item.articleName].nb++;
                services[item.articleName].ca += item.totalPrice || 0;
            }
        });
    });

    document.getElementById('caTotal').innerText = euro(totalCA);
    document.getElementById('nbFactures').innerText = invoices.length;
    document.getElementById('nbClients').innerText = customers.size;
    document.getElementById('panierMoyen').innerText = invoices.length ? euro(totalCA/invoices.length) : '0 €';
    document.getElementById('periodLabel').innerText = label + ' — ' + invoices.length + ' factures';

    const hours = Object.keys(hourly).sort((a,b) => a-b);
    const hourlyCtx = document.getElementById('hourlyChart');
    if (hourlyCtx && hours.length > 0) {
        charts.hourly = new Chart(hourlyCtx, {
            type: 'line',
            data: {
                labels: hours.map(h => h + 'h'),
                datasets: [{
                    label: 'CA (€)',
                    data: hours.map(h => hourly[h]),
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0,122,255,0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#007aff'
                }]
            },
            options: { ...chartOptions(), scales: { y: { beginAtZero: true } } }
        });
    }

    const paymentCtx = document.getElementById('paymentChart');
    if (paymentCtx && Object.keys(payments).length > 0) {
        charts.payment = new Chart(paymentCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(payments),
                datasets: [{
                    data: Object.values(payments),
                    backgroundColor: ['#007aff','#34c759','#ff9500','#af52de','#ff2d55','#5ac8fa']
                }]
            },
            options: chartOptions()
        });
    }

    const activeSyscodes = Object.keys(SYSCODES).filter(c => syscodes[c] > 0);
    const syscodeCtx = document.getElementById('syscodeChart');
    if (syscodeCtx && activeSyscodes.length > 0) {
        charts.syscode = new Chart(syscodeCtx, {
            type: 'pie',
            data: {
                labels: activeSyscodes.map(c => SYSCODES[c].icon + ' ' + SYSCODES[c].label),
                datasets: [{
                    data: activeSyscodes.map(c => syscodes[c]),
                    backgroundColor: activeSyscodes.map(c => SYSCODES[c].color)
                }]
            },
            options: chartOptions()
        });
    }

    const groupEntries = Object.entries(groups).sort((a,b) => b[1]-a[1]).slice(0,10);
    const groupCtx = document.getElementById('rentalGroupChart');
    if (groupCtx && groupEntries.length > 0) {
        charts.groups = new Chart(groupCtx, {
            type: 'bar',
            data: {
                labels: groupEntries.map(g => g[0]),
                datasets: [{
                    label: 'CA (€)',
                    data: groupEntries.map(g => g[1]),
                    backgroundColor: '#af52de',
                    borderRadius: 8
                }]
            },
            options: { ...chartOptions(), scales: { y: { beginAtZero: true } } }
        });
    }

    fillTable('#locationTable tbody',
        Object.entries(locations).sort((a,b)=>b[1].ca-a[1].ca).slice(0,10),
        ([n,r])=>`<tr><td>${n}</td><td>${r.contrats}</td><td>${r.jours}</td><td>${euro(r.ca)}</td></tr>`);
    fillTable('#salesTable tbody',
        Object.entries(ventes).sort((a,b)=>b[1].ca-a[1].ca).slice(0,10),
        ([n,r])=>`<tr><td>${n}</td><td>${r.qty}</td><td>${euro(r.ca)}</td></tr>`);
    fillTable('#serviceTable tbody',
        Object.entries(services).sort((a,b)=>b[1].ca-a[1].ca).slice(0,10),
        ([n,r])=>`<tr><td>${n}</td><td>${r.nb}</td><td>${euro(r.ca)}</td></tr>`);
}

function showError(message) {
    const dashboard = document.getElementById('dashboard');
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-msg';
    errorDiv.innerHTML = `⚠️ <strong>Erreur de connexion</strong><br>${message}<br><br>
        <small>💡 <strong>Solution recommandée :</strong> Crée un Cloudflare Worker gratuit (5 min) pour faire le proxy.<br>
        Va sur <a href="https://dash.cloudflare.com" target="_blank">dash.cloudflare.com</a> → Workers → Create service → colle le code dans les commentaires du fichier HTML.</small>`;
    dashboard.prepend(errorDiv);
    document.getElementById('loadingMsg')?.remove();
}

async function refresh() {
    try {
        document.getElementById('periodLabel').innerText = 'Chargement...';

        const { start, label } = getDateBounds(currentRange);
        const createdAfter = start.toISOString().split('T')[0];

        allInvoices = await loadInvoices(createdAfter);
        const filtered = filterByDate(allInvoices, currentRange);

        const select = document.getElementById('branchFilter');
        const currentBranch = select.value;
        select.innerHTML = '<option value="">🏪 Tous les magasins</option>';
        [...new Set(filtered.map(i => i.branchCode).filter(Boolean))].sort().forEach(b => {
            const opt = document.createElement('option');
            opt.value = b;
            opt.textContent = '🏪 ' + b;
            select.appendChild(opt);
        });
        select.value = currentBranch;

        renderBranchKpis(filtered);
        const v = select.value;
        render(v ? filtered.filter(i => i.branchCode === v) : filtered, label + (v ? ' — ' + v : ''));

    } catch (error) {
        console.error('Erreur:', error);
        document.getElementById('periodLabel').innerText = 'Erreur de chargement';
        showError(error.message);
    }
}

async function start() {
    const select = document.getElementById('branchFilter');
    select.addEventListener('change', () => {
        if (!allInvoices.length) return;
        const filtered = filterByDate(allInvoices, currentRange);
        const { label } = getDateBounds(currentRange);
        const v = select.value;
        render(v ? filtered.filter(i => i.branchCode === v) : filtered, label + (v ? ' — ' + v : ''));
    });

    document.querySelectorAll('#dateBar button').forEach(btn => {
        btn.addEventListener('click', async () => {
            document.querySelectorAll('#dateBar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRange = btn.dataset.range;
            await refresh();
        });
    });

    await refresh();
}

start();
</script>
</body>
</html>
